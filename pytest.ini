[pytest]
pythonpath = backend
testpaths = tests
addopts = -ra --strict-markers
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::jwt.warnings.InsecureKeyLengthWarning
    ignore::pytest.PytestCollectionWarning
    ignore:SelectableGroups dict interface is deprecated
    ignore:asyncio.run\(\) cannot be called from a running event loop

markers =
    unit: Pure unit tests; never touch the network, database, redis or docker.
    integration: Integration tests against real PostgreSQL + Redis (docker compose services).
    e2e: Full end-to-end API journeys through the FastAPI TestClient.
    slow: Slow tests (real docker sandbox execution, heavy I/O). Skipped by default via -m "not slow".
    performance: Load / concurrency / throughput checks. Often skipped by default.
    real_ratelimit: Enables the real Redis-backed rate limiter for this test.
    real_docker: Runs real docker sandbox commands; skipped when docker is unavailable.
    real_arq: Uses the real ARQ Redis queue instead of the job recorder.
